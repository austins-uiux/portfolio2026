<!doctype html>
<html lang="ko" data-theme="dark" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#11151b" />
    <script>
      (() => {
        let theme = 'dark';
        try { const saved = JSON.parse(localStorage.getItem('aplus:theme')); if (saved === 'light' || saved === 'dark') theme = saved; } catch {}
        document.documentElement.dataset.theme = theme;
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#11151b' : '#ffffff';
      })();
    </script>
    <meta name="description" content="AI 네이티브 프로덕트 디자이너 Austin의 프로젝트, AI 활용 능력, 디자인 철학을 담은 포트폴리오 A+studio." />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <title>A+studio: Austin의 AI Agentic 포트폴리오</title>
    <link rel="icon" type="image/svg+xml" href="/assets/home-Frame4.svg" />
    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
